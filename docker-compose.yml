# Walkie Lagos en el restaurante, con HTTPS automático.
#
#   1) copia .env.example a .env y pon tu dominio y tu PIN
#   2) docker compose up -d
#
# Caddy pide el certificado a Let's Encrypt solo (necesita que el dominio
# apunte a la IP pública del local y los puertos 80/443 abiertos).
services:
  walkie:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      PIN: "${PIN:?Define PIN en el archivo .env}"
      APP_NAME: "${APP_NAME:-Walkie Lagos}"
      TAGLINE: "${TAGLINE:-Radio interna del restaurante}"
      MAX_TALK_SECONDS: "${MAX_TALK_SECONDS:-45}"
      MAX_ALERT_SECONDS: "${MAX_ALERT_SECONDS:-25}"
      ALERTS_ENABLED: "${ALERTS_ENABLED:-true}"
      ROOMS: "${ROOMS:-}"
    expose:
      - "3000"
    networks:
      - walkie
    # La app no guarda audio ni datos: solo necesita memoria. Le ponemos techo
    # para que no se coma el servidor del local.
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - walkie
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Define DOMAIN en el archivo .env (ej. walkie.turestaurante.com)}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - walkie

volumes:
  caddy_data:
  caddy_config:

networks:
  walkie:
