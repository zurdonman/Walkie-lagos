<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Walkie Lagos</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Entrada -->
    <section id="login" class="login">
      <form id="loginForm" class="login-card">
        <h1>📻 Walkie Lagos</h1>
        <p class="tagline">Radio interna del restaurante</p>

        <label>
          <span>Tu nombre</span>
          <input id="nameInput" maxlength="24" placeholder="Marta" autocomplete="given-name" required />
        </label>

        <label id="pinField">
          <span>PIN</span>
          <input id="pinInput" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password" />
        </label>

        <div>
          <span class="label">Canal</span>
          <div id="loginRooms" class="rooms-pick"></div>
        </div>

        <button type="submit" id="enterBtn" class="btn">Entrar</button>
        <p id="loginError" class="error" hidden></p>
      </form>
    </section>

    <!-- App -->
    <main id="app" hidden>
      <header class="top">
        <button id="channelsBtn" class="room-btn">
          <span id="roomEmoji">📢</span>
          <span>
            <strong id="roomName">General</strong>
            <small id="roomStatus">conectando…</small>
          </span>
        </button>
        <span id="onlineBadge" class="badge">0</span>
      </header>

      <section class="stage">
        <div id="incoming" class="incoming" hidden>
          <strong id="incomingName">Alguien</strong> está hablando…
        </div>

        <button id="ptt" class="ptt">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
            <path d="M6 11a6 6 0 0012 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span id="pttText">MANTÉN<br />PARA HABLAR</span>
          <small id="pttTimer"></small>
        </button>

        <div id="roster" class="roster"></div>
      </section>

      <section class="chat">
        <div id="log" class="log"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" maxlength="500" placeholder="Escribe al canal…" autocomplete="off" enterkeyhint="send" />
          <button type="submit" aria-label="Enviar">➤</button>
        </form>
      </section>
    </main>

    <!-- Canales -->
    <div id="drawer" class="drawer" hidden>
      <div class="backdrop" data-close></div>
      <div class="sheet">
        <h2>Canales</h2>
        <div id="roomList" class="room-list"></div>
        <button class="link" data-close>Cerrar</button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js"></script>
  </body>
</html>
