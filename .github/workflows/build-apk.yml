name: Compilar APK

# Genera el APK de Android en cada push. No hace falta Android Studio:
# GitHub lo compila y lo deja descargable en la pestaña Actions / Releases.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

# Necesario para publicar el APK como Release (descarga con un clic).
permissions:
  contents: write

jobs:
  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Verificar el APK
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2
          "$AAPT" dump badging artifacts/walkie-lagos.apk > /tmp/badging.txt || true
          for key in "package:" "sdkVersion" "targetSdkVersion" "application-label" "uses-permission: name='android.permission.RECORD_AUDIO'" "launchable-activity"; do
            line=$(grep -m1 "$key" /tmp/badging.txt || echo "NO ENCONTRADO: $key")
            echo "::notice title=APK::${line}"
          done
          "$AAPT" dump permissions artifacts/walkie-lagos.apk >> /tmp/badging.txt

      - name: Nombre del archivo
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/walkie-lagos.apk
          ls -lh artifacts/walkie-lagos.apk

      - name: Publicar el error como anotaciones
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|^\* What" /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done

      - name: Guardar log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: walkie-lagos-apk
          path: artifacts/walkie-lagos.apk
          if-no-files-found: error

      - name: Publicar el APK como Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Walkie Lagos APK ${{ github.run_number }} (${{ github.ref_name }})
          body: |
            APK de depuración generado automáticamente.

            Commit: ${{ github.sha }}
            Rama: ${{ github.ref_name }}

            Descarga el archivo `walkie-lagos.apk`, pásalo al móvil y ábrelo para instalar.
          files: artifacts/walkie-lagos.apk
          make_latest: true
