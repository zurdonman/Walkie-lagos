name: Compilar APK

# Genera el APK de Android en cada push. No hace falta Android Studio:
# GitHub lo compila y lo deja descargable en la pestaña Actions / Releases.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

# Necesario para publicar el APK como Release (descarga con un clic).
permissions:
  contents: write

jobs:
  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Modelo de voz español (para transcribir sin internet)
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          # Se prueba el sitio oficial y, si no responde, un espejo de Hugging Face.
          for URL in \
            "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip" \
            "https://huggingface.co/alphacep/vosk-model-small-es-0.42/resolve/main/vosk-model-small-es-0.42.zip"; do
            echo "Probando $URL"
            if curl -fsSL --retry 2 --max-time 300 -o /tmp/vosk.zip "$URL"; then
              echo "Descargado ($(du -h /tmp/vosk.zip | cut -f1))"
              break
            fi
          done
          if [ -f /tmp/vosk.zip ]; then
            unzip -q /tmp/vosk.zip -d /tmp/vosk
            mkdir -p android/app/src/main/assets/vosk-es
            cp -r /tmp/vosk/vosk-model-small-es-0.42/* android/app/src/main/assets/vosk-es/
            du -sh android/app/src/main/assets/vosk-es
            echo "::notice title=Transcripción::modelo incluido en el APK"
          else
            echo "::warning title=Transcripción::no se pudo descargar el modelo; el APK se compila sin transcripción"
          fi

      - name: Clave de firma (para que los dos APK instalen uno encima del otro)
        run: |
          mkdir -p "$HOME/.walkie"
          base64 -d scripts/keystore.b64 > "$HOME/.walkie/walkie.p12"
          ls -l "$HOME/.walkie/walkie.p12"
          echo "WALKIE_KEYSTORE=$HOME/.walkie/walkie.p12" >> "$GITHUB_ENV"
          echo "WALKIE_KEY_PASS=walkie2024" >> "$GITHUB_ENV"
          echo "WALKIE_KEY_ALIAS=walkie" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        run: |
          gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          ls -lh app/build/outputs/apk/release app/build/outputs/apk/debug
        shell: bash

      - name: Nombre de los archivos
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/walkie-lagos.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/walkie-lagos-diagnostico.apk
          ls -lh artifacts/

      - name: Verificar la firma
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner
          for f in artifacts/walkie-lagos.apk artifacts/walkie-lagos-diagnostico.apk; do
            "$APKSIGNER" verify --print-certs "$f" | grep -m1 "SHA-256" | tee "/tmp/$(basename "$f").sha"
          done
          if diff -q /tmp/walkie-lagos.apk.sha /tmp/walkie-lagos-diagnostico.apk.sha > /dev/null; then
            echo "::notice title=Firma::los dos APK van firmados con la misma clave"
          else
            echo "::error title=Firma::los APK no comparten clave; Android pedirá desinstalar"
          fi

      - name: Verificar el APK
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2
          "$AAPT" dump badging artifacts/walkie-lagos.apk > /tmp/badging.txt || true
          for key in "package:" "targetSdkVersion" "application-label" "uses-permission: name='android.permission.RECORD_AUDIO'" "launchable-activity"; do
            line=$(grep -m1 "$key" /tmp/badging.txt || echo "NO ENCONTRADO: $key")
            echo "::notice title=APK::${line}"
            case "$line" in NO\ ENCONTRADO*) echo "::warning title=APK::${line}" ;; esac
          done
          "$AAPT" dump permissions artifacts/walkie-lagos.apk >> /tmp/badging.txt
          # El modelo de voz tiene que ir dentro, si no la transcripción no existe.
          if unzip -l artifacts/walkie-lagos.apk | grep -q "assets/vosk-es/"; then
            echo "::notice title=Transcripción::modelo de voz incluido en el APK"
          else
            echo "::warning title=Transcripción::el APK sale SIN modelo de voz; la voz no se transcribirá"
          fi

      - name: Publicar el error como anotaciones
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|^\* What" /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done

      - name: Guardar log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: walkie-lagos-apk
          path: |
            artifacts/walkie-lagos.apk
            artifacts/walkie-lagos-diagnostico.apk
          if-no-files-found: error

      - name: Publicar el APK como Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Walkie Lagos APK ${{ github.run_number }} (${{ github.ref_name }})
          body: |
            APK de depuración generado automáticamente.

            Commit: ${{ github.sha }}
            Rama: ${{ github.ref_name }}

            Dos archivos, ambos instalables y firmados con la misma clave:

            - `walkie-lagos.apk` → **el normal**, para el día a día.
            - `walkie-lagos-diagnostico.apk` → **el de pruebas**: escribe un registro de lo
              que hace y de cualquier fallo en `Descargas/log walkie/` (`walkie-log.txt` y,
              si la app se cierra, `walkie-crash.txt`). Botón **Registro** en la app para
              verlo y enviarlo.

            Pásalos al móvil y ábrelos para instalar. Si ya tienes una versión anterior,
            se actualiza encima sin perder nada.
          files: |
            artifacts/walkie-lagos.apk
            artifacts/walkie-lagos-diagnostico.apk
          make_latest: true
